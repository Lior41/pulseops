name: Quality and application workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pulseops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pulseops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulseops -d pulseops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pulseops:ci_only@127.0.0.1:5432/pulseops_test
      TEST_DATABASE_URL: postgresql://pulseops:ci_only@127.0.0.1:5432/pulseops_test
      AUTH_SECRET: ci-isolated-ephemeral-session-secret-2026
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      DEMO_MODE: "true"
      DEMO_PASSWORD: PulseOps-Demo-2026!
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run db:migrate
      - name: Database integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/pulseops
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
